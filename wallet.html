<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - QFS USA</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #0f1419 100%);
            min-height: 100vh;
            color: #e2e8f0;
            transition: background 0.3s ease;
            position: relative;
        }

        /* Enhanced Crypto USA Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 15% 30%, rgba(59, 130, 246, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 85% 70%, rgba(139, 92, 246, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.12) 0%, transparent 70%),
                radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGradient 8s ease-in-out infinite;
        }

        @keyframes pulseGradient {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Animated crypto symbols background - More Visible */
        body::after {
            content: '₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-size: 10rem;
            font-weight: bold;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.4;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #10b981, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: drift 25s linear infinite;
        }

        @keyframes drift {
            0% { transform: translateY(0px) translateX(0px); }
            100% { transform: translateY(-1500px) translateX(50px); }
        }

        /* Grid Pattern Background */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(90deg, rgba(59, 130, 246, 0.08) 1px, transparent 1px),
                linear-gradient(rgba(59, 130, 246, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        body.light-mode {
            background: linear-gradient(135deg, #f0f4f8 0%, #e0e7ff 50%, #f3f4f6 100%);
            color: #1a1a1a;
        }

        body.light-mode::before {
            background: 
                radial-gradient(circle at 15% 30%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 85% 70%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 70%),
                radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.06) 0%, transparent 50%);
        }

        body.light-mode::after {
            opacity: 0.04;
        }

        body.light-mode .grid-background {
            background-image: 
                linear-gradient(90deg, rgba(139, 92, 246, 0.06) 1px, transparent 1px),
                linear-gradient(rgba(139, 92, 246, 0.06) 1px, transparent 1px);
            opacity: 0.3;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.3);
            border: 2px solid rgba(59, 130, 246, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            z-index: 9999;
            color: #fbbf24;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }

        .theme-toggle:hover {
            background: rgba(59, 130, 246, 0.4);
            border-color: rgba(59, 130, 246, 0.9);
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.4);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        body.light-mode .theme-toggle {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
            color: #3b82f6;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
        }

        body.light-mode .theme-toggle:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.8);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.3);
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        body.light-mode nav {
            background: rgba(240, 244, 248, 0.95);
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
        }

        nav .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1001;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 2.5rem;
            font-weight: 500;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        body.light-mode nav a {
            color: #64748b;
        }

        nav a:hover {
            color: #3b82f6;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            text-decoration: none;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .wallet-header {
            margin-top: 80px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #f0f4f8;
        }

        body.light-mode .wallet-header h1 {
            color: #0f172a;
        }

        .wallet-header p {
            color: #a1aec6;
            font-size: 1rem;
        }

        body.light-mode .wallet-header p {
            color: #64748b;
        }

        .header-content {
            flex: 1;
        }

        .withdraw-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .withdraw-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .withdraw-btn:active {
            transform: translateY(0);
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        body.light-mode .balance-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08) 0%, rgba(139, 92, 246, 0.08) 100%);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .balance-label {
            color: #a1aec6;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        body.light-mode .balance-label {
            color: #64748b;
        }

        .balance-amount {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .balance-meta {
            display: flex;
            justify-content: space-between;
            color: #64748b;
            font-size: 0.9rem;
        }

        body.light-mode .balance-meta {
            color: #94a3b8;
        }

        /* Assets Section */
        .assets-section {
            margin-bottom: 2rem;
        }

        .assets-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .assets-section h2 {
            font-size: 1.8rem;
            color: #f0f4f8;
        }

        body.light-mode .assets-section h2 {
            color: #0f172a;
        }

        .assets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .asset-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08) 0%, rgba(139, 92, 246, 0.08) 100%);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        body.light-mode .asset-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05) 0%, rgba(139, 92, 246, 0.05) 100%);
            border: 1px solid rgba(139, 92, 246, 0.15);
        }

        .asset-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.15);
            transform: translateY(-5px);
        }

        body.light-mode .asset-card:hover {
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.1);
        }

        .asset-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .asset-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .asset-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            flex-shrink: 0;
        }

        .asset-logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .asset-name-group h3 {
            color: #f0f4f8;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        body.light-mode .asset-name-group h3 {
            color: #0f172a;
        }

        .asset-symbol {
            color: #a1aec6;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        body.light-mode .asset-symbol {
            color: #64748b;
        }

        .asset-price {
            text-align: right;
        }

        .asset-price-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: #3b82f6;
        }

        .price-change {
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .price-change.positive {
            color: #10b981;
        }

        .price-change.negative {
            color: #ef4444;
        }

        .asset-divider {
            height: 1px;
            background: rgba(148, 163, 184, 0.1);
            margin: 1rem 0;
        }

        body.light-mode .asset-divider {
            background: rgba(139, 92, 246, 0.1);
        }

        .asset-holding {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .holding-label {
            color: #a1aec6;
            font-size: 0.9rem;
        }

        body.light-mode .holding-label {
            color: #64748b;
        }

        .holding-value {
            color: #cbd5e1;
            font-weight: 600;
        }

        body.light-mode .holding-value {
            color: #1a1a1a;
        }

        .asset-total-value {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
        }

        body.light-mode .asset-total-value {
            border-top: 1px solid rgba(139, 92, 246, 0.1);
        }

        .total-label {
            color: #a1aec6;
            font-size: 0.9rem;
        }

        body.light-mode .total-label {
            color: #64748b;
        }

        .total-value {
            font-size: 1.3rem;
            font-weight: 800;
            color: #3b82f6;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #a1aec6;
        }

        body.light-mode .loading {
            color: #64748b;
        }

        .spinner {
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .wallet-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .wallet-header h1 {
                font-size: 1.8rem;
            }

            .balance-amount {
                font-size: 2rem;
            }

            .assets-grid {
                grid-template-columns: 1fr;
            }

            nav .nav-content {
                flex-wrap: wrap;
            }

            nav a {
                margin-left: 1rem;
                font-size: 0.85rem;
            }

            .withdraw-btn {
                margin-top: 1rem;
                width: 100%;
                justify-content: center;
            }

            .theme-toggle {
                top: 1.5rem;
                right: 1.5rem;
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>

    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">
        <i class="fas fa-moon"></i>
    </button>

    <nav>
        <div class="nav-content">
            <div class="nav-logo">QFS USA</div>
            <div>
                <a href="index.html">Dashboard</a>
                <a href="#" class="logout-btn" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="wallet-header">
            <div class="header-content">
                <h1>💎 Client851 Wallet</h1>
                <p>Real-time asset management and monitoring</p>
            </div>
            <button class="withdraw-btn" onclick="goToWithdraw()">
                <i class="fas fa-arrow-right"></i> Withdraw Funds
            </button>
        </div>

        <div class="balance-card">
            <div class="balance-label">Total Portfolio Value</div>
            <div class="balance-amount">$62,825,286.61</div>
            <div class="balance-meta">
                <span>Last Updated: <span id="updateTime">Just now</span></span>
                <span>Status: <span style="color: #10b981;">● Active</span></span>
            </div>
        </div>

        <div class="assets-section">
            <div class="assets-header">
                <h2>Digital Assets</h2>
            </div>
            <div class="assets-grid" id="assetsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading asset data...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme Toggle Functionality
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        // Check for saved theme preference or default to dark mode
        const currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'light') {
            body.classList.add('light-mode');
            themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }

        // Theme toggle click handler
        themeToggle.addEventListener('click', function() {
            body.classList.toggle('light-mode');
            
            if (body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
                themeToggle.title = 'Switch to Dark Mode';
            } else {
                localStorage.setItem('theme', 'dark');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
                themeToggle.title = 'Switch to Light Mode';
            }
        });

        // Fixed crypto holdings that equal $62,825,286.61 with Bitcoin dominant
        const holdings = {
            'bitcoin': { amount: 750, value: 59625000, symbol: 'BTC' }, // Bitcoin has the most value
            'ethereum': { amount: 24000, value: 1560000, symbol: 'ETH' },
            'ripple': { amount: 42000000, value: 600000, symbol: 'XRP' },
            'litecoin': { amount: 1300000, value: 45000, symbol: 'LTC' },
            'cardano': { amount: 300000000, value: 630000, symbol: 'ADA' },
            'polkadot': { amount: 75000000, value: 195000, symbol: 'DOT' },
            'dogecoin': { amount: 750000000, value: 170286.61, symbol: 'DOGE' }
        };

        // Map coin IDs to CoinGecko image URLs
        const coinLogos = {
            'bitcoin': 'https://assets.coingecko.com/coins/images/1/large/bitcoin.png',
            'ethereum': 'https://assets.coingecko.com/coins/images/279/large/ethereum.png',
            'ripple': 'https://assets.coingecko.com/coins/images/44/large/xrp.png',
            'litecoin': 'https://assets.coingecko.com/coins/images/2/large/litecoin.png',
            'cardano': 'https://assets.coingecko.com/coins/images/975/large/cardano.png',
            'polkadot': 'https://assets.coingecko.com/coins/images/12171/large/polkadot.png',
            'dogecoin': 'https://assets.coingecko.com/coins/images/5/large/dogecoin.png'
        };

        const coinNames = {
            'bitcoin': 'Bitcoin',
            'ethereum': 'Ethereum',
            'ripple': 'Ripple',
            'litecoin': 'Litecoin',
            'cardano': 'Cardano',
            'polkadot': 'Polkadot',
            'dogecoin': 'Dogecoin'
        };

        function displayAssets() {
            const container = document.getElementById('assetsContainer');
            container.innerHTML = '';

            // Sort by value descending
            const sortedAssets = Object.entries(holdings).sort(([,a], [,b]) => b.value - a.value);

            sortedAssets.forEach(([cryptoKey, { amount, value, symbol }]) => {
                const price = value / amount;
                const logoUrl = coinLogos[cryptoKey];
                const name = coinNames[cryptoKey];

                const card = document.createElement('div');
                card.className = 'asset-card';
                card.innerHTML = `
                    <div class="asset-top">
                        <div class="asset-info">
                            <div class="asset-logo">
                                <img src="${logoUrl}" alt="${symbol}" onerror="this.style.display='none'">
                            </div>
                            <div class="asset-name-group">
                                <h3>${name}</h3>
                                <div class="asset-symbol">${symbol}</div>
                            </div>
                        </div>
                        <div class="asset-price">
                            <div class="asset-price-value">$${price.toFixed(2)}</div>
                        </div>
                    </div>
                    <div class="asset-divider"></div>
                    <div class="asset-holding">
                        <span class="holding-label">Amount Held</span>
                        <span class="holding-value">${amount.toLocaleString()} ${symbol}</span>
                    </div>
                    <div class="asset-total-value">
                        <span class="total-label">Total Value</span>
                        <span class="total-value">$${value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('updateTime').textContent = timeString;
        }

        function goToWithdraw() {
            window.location.href = 'withdraw.html';
        }

        function logout() {
            window.location.href = 'login.html';
        }

        displayAssets();
        updateTime();
    </script>
</body>
</html>
