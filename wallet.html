<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - QFS USA</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        nav .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 2.5rem;
            font-weight: 500;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: #3b82f6;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            text-decoration: none;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .wallet-header {
            margin-top: 80px;
            margin-bottom: 2rem;
        }

        .wallet-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #f0f4f8;
        }

        .wallet-header p {
            color: #a1aec6;
            font-size: 1rem;
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .balance-label {
            color: #a1aec6;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .balance-amount {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .balance-meta {
            display: flex;
            justify-content: space-between;
            color: #64748b;
            font-size: 0.9rem;
        }

        /* Assets Section */
        .assets-section {
            margin-bottom: 2rem;
        }

        .assets-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .assets-section h2 {
            font-size: 1.8rem;
            color: #f0f4f8;
        }

        .assets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .asset-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05) 0%, rgba(139, 92, 246, 0.05) 100%);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .asset-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.1);
            transform: translateY(-5px);
        }

        .asset-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .asset-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .asset-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .asset-name-group h3 {
            color: #f0f4f8;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .asset-symbol {
            color: #a1aec6;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .asset-price {
            text-align: right;
        }

        .asset-price-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: #3b82f6;
        }

        .price-change {
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .price-change.positive {
            color: #10b981;
        }

        .price-change.negative {
            color: #ef4444;
        }

        .asset-divider {
            height: 1px;
            background: rgba(148, 163, 184, 0.1);
            margin: 1rem 0;
        }

        .asset-holding {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .holding-label {
            color: #a1aec6;
            font-size: 0.9rem;
        }

        .holding-value {
            color: #cbd5e1;
            font-weight: 600;
        }

        .asset-total-value {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
        }

        .total-label {
            color: #a1aec6;
            font-size: 0.9rem;
        }

        .total-value {
            font-size: 1.3rem;
            font-weight: 800;
            color: #3b82f6;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #a1aec6;
        }

        .spinner {
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .wallet-header h1 {
                font-size: 1.8rem;
            }

            .balance-amount {
                font-size: 2rem;
            }

            .assets-grid {
                grid-template-columns: 1fr;
            }

            nav .nav-content {
                flex-wrap: wrap;
            }

            nav a {
                margin-left: 1rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-content">
            <div class="nav-logo">QFS USA</div>
            <div>
                <a href="index.html">Dashboard</a>
                <a href="#" class="logout-btn" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="wallet-header">
            <h1>💎 Your Portfolio</h1>
            <p>Real-time asset management and monitoring</p>
        </div>

        <div class="balance-card">
            <div class="balance-label">Total Portfolio Value</div>
            <div class="balance-amount" id="totalBalance">$62,762,971.78</div>
            <div class="balance-meta">
                <span>Last Updated: <span id="updateTime">Just now</span></span>
                <span>Status: <span style="color: #10b981;">● Active</span></span>
            </div>
        </div>

        <div class="assets-section">
            <div class="assets-header">
                <h2>Digital Assets</h2>
            </div>
            <div class="assets-grid" id="assetsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading real-time market data...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Crypto holdings
        const holdings = {
            'bitcoin': { amount: 1.5, symbol: 'BTC', logo: '₿', color: 'f7931a' },
            'ethereum': { amount: 20, symbol: 'ETH', logo: 'Ξ', color: '627eea' },
            'ripple': { amount: 5000, symbol: 'XRP', logo: '✕', color: '23292f' },
            'litecoin': { amount: 50, symbol: 'LTC', logo: 'Ł', color: 'f7931a' },
            'cardano': { amount: 10000, symbol: 'ADA', logo: '⧫', color: '0033cc' },
            'polkadot': { amount: 500, symbol: 'DOT', logo: '●', color: 'e6007a' }
        };

        async function fetchCryptoPrices() {
            try {
                const ids = Object.keys(holdings).join(',');
                const response = await fetch(
                    `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`
                );
                
                if (!response.ok) throw new Error('Failed to fetch prices');
                
                const data = await response.json();
                displayAssets(data);
                updateTime();
            } catch (error) {
                console.error('Error fetching prices:', error);
                displayAssets(null);
            }
        }

        function displayAssets(priceData) {
            const container = document.getElementById('assetsContainer');
            container.innerHTML = '';

            let totalValue = 0;

            Object.entries(holdings).forEach(([cryptoId, { amount, symbol, logo, color }]) => {
                let price = 0;
                let change24h = 0;
                let value = 0;

                if (priceData && priceData[cryptoId]) {
                    price = priceData[cryptoId].usd || 0;
                    change24h = priceData[cryptoId].usd_24h_change || 0;
                    value = amount * price;
                    totalValue += value;
                } else {
                    const fallbackPrices = {
                        'bitcoin': 42500,
                        'ethereum': 2350,
                        'ripple': 0.52,
                        'litecoin': 78,
                        'cardano': 0.65,
                        'polkadot': 8.5
                    };
                    price = fallbackPrices[cryptoId] || 0;
                    value = amount * price;
                    totalValue += value;
                }

                const isPositive = change24h >= 0;
                const changeIcon = isPositive ? '📈' : '📉';
                const changeClass = isPositive ? 'positive' : 'negative';

                const card = document.createElement('div');
                card.className = 'asset-card';
                card.innerHTML = `
                    <div class="asset-top">
                        <div class="asset-info">
                            <div class="asset-logo">${logo}</div>
                            <div class="asset-name-group">
                                <h3>${cryptoId.charAt(0).toUpperCase() + cryptoId.slice(1)}</h3>
                                <div class="asset-symbol">${symbol}</div>
                            </div>
                        </div>
                        <div class="asset-price">
                            <div class="asset-price-value">$${price.toFixed(2)}</div>
                            <div class="price-change ${changeClass}">
                                ${changeIcon} ${isPositive ? '+' : ''}${change24h.toFixed(2)}%
                            </div>
                        </div>
                    </div>
                    <div class="asset-divider"></div>
                    <div class="asset-holding">
                        <span class="holding-label">Amount Held</span>
                        <span class="holding-value">${amount} ${symbol}</span>
                    </div>
                    <div class="asset-total-value">
                        <span class="total-label">Total Value</span>
                        <span class="total-value">$${value.toLocaleString('en-US', { maximumFractionDigits: 2 })}</span>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('totalBalance').textContent = 
                '$' + totalValue.toLocaleString('en-US', { maximumFractionDigits: 2 });
        }

        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('updateTime').textContent = timeString;
        }

        function logout() {
            window.location.href = 'login.html';
        }

        fetchCryptoPrices();
        setInterval(fetchCryptoPrices, 30000);
    </script>
</body>
</html>
