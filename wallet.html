<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QFS Wallet</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #0f1419 100%);
            min-height: 100vh;
            color: #e2e8f0;
            transition: background 0.3s ease;
            position: relative;
        }

        /* Enhanced Crypto USA Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 15% 30%, rgba(59, 130, 246, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 85% 70%, rgba(139, 92, 246, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.12) 0%, transparent 70%),
                radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGradient 8s ease-in-out infinite;
        }

        @keyframes pulseGradient {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Animated crypto symbols background */
        body::after {
            content: '₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-size: 10rem;
            font-weight: bold;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.4;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #10b981, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: drift 25s linear infinite;
        }

        @keyframes drift {
            0% { transform: translateY(0px) translateX(0px); }
            100% { transform: translateY(-1500px) translateX(50px); }
        }

        /* Grid Pattern Background */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(90deg, rgba(59, 130, 246, 0.08) 1px, transparent 1px),
                linear-gradient(rgba(59, 130, 246, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        body.light-mode {
            background: linear-gradient(135deg, #f0f4f8 0%, #e0e7ff 50%, #f3f4f6 100%);
            color: #1a1a1a;
        }

        body.light-mode::before {
            background: 
                radial-gradient(circle at 15% 30%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 85% 70%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 70%),
                radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.06) 0%, transparent 50%);
        }

        body.light-mode::after {
            opacity: 0.04;
        }

        body.light-mode .grid-background {
            background-image: 
                linear-gradient(90deg, rgba(139, 92, 246, 0.06) 1px, transparent 1px),
                linear-gradient(rgba(139, 92, 246, 0.06) 1px, transparent 1px);
            opacity: 0.3;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.3);
            border: 2px solid rgba(59, 130, 246, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            z-index: 9999;
            color: #fbbf24;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }

        .theme-toggle:hover {
            background: rgba(59, 130, 246, 0.4);
            border-color: rgba(59, 130, 246, 0.9);
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.4);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        body.light-mode .theme-toggle {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
            color: #3b82f6;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
        }

        body.light-mode .theme-toggle:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.8);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.3);
        }

        /* Header - Sticky but hides on scroll */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            opacity: 1;
            visibility: visible;
        }

        .header.hidden {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-100%);
            pointer-events: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .wallet-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.light-mode .wallet-title {
            color: #0f172a;
        }

        .qfs-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            font-weight: 800;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        body.light-mode .qfs-logo {
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25);
            border: 2px solid rgba(59, 130, 246, 0.2);
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            text-decoration: none;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
        }

        body.light-mode .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            border-color: #dc2626;
        }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
            margin-top: 120px;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        /* Card Styles - Matching the Design */
        .card {
            background: linear-gradient(135deg, rgba(30, 64, 131, 0.6) 0%, rgba(30, 64, 131, 0.4) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }

        body.light-mode .card {
            background: linear-gradient(135deg, rgba(200, 210, 240, 0.4) 0%, rgba(200, 210, 240, 0.2) 100%);
            border: 1px solid rgba(59, 130, 246, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        body.light-mode .card:hover {
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.15);
        }

        /* Card Header */
        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #60a5fa;
            flex-shrink: 0;
        }

        .card-title {
            font-size: 1rem;
            color: #a1aec6;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        body.light-mode .card-title {
            color: #64748b;
        }

        /* Card Amount */
        .card-amount {
            font-size: 2.8rem;
            font-weight: 800;
            color: white;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.light-mode .card-amount {
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Card Footer */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
        }

        body.light-mode .card-footer {
            border-top: 1px solid rgba(59, 130, 246, 0.15);
        }

        .card-currency {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #cbd5e1;
            font-weight: 600;
        }

        body.light-mode .card-currency {
            color: #475569;
        }

        .flag {
            font-size: 1.2rem;
        }

        .more-details, .withdraw-btn-card {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: none;
            border: none;
            padding: 0;
            font-size: 1rem;
        }

        .more-details:hover, .withdraw-btn-card:hover {
            color: #93c5fd;
            gap: 0.8rem;
        }

        body.light-mode .more-details,
        body.light-mode .withdraw-btn-card {
            color: #3b82f6;
        }

        body.light-mode .more-details:hover,
        body.light-mode .withdraw-btn-card:hover {
            color: #2563eb;
        }

        /* Assets Section */
        .assets-section {
            margin-top: 2rem;
        }

        .assets-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f0f4f8;
            margin-bottom: 1.5rem;
        }

        body.light-mode .assets-title {
            color: #0f172a;
        }

        .assets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .asset-card {
            background: linear-gradient(135deg, rgba(30, 64, 131, 0.5) 0%, rgba(30, 64, 131, 0.3) 100%);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        body.light-mode .asset-card {
            background: linear-gradient(135deg, rgba(200, 210, 240, 0.3) 0%, rgba(200, 210, 240, 0.15) 100%);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .asset-card:hover {
            transform: translateY(-3px);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .asset-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .asset-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .asset-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .asset-logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .asset-name {
            color: #f0f4f8;
            font-weight: 600;
        }

        body.light-mode .asset-name {
            color: #0f172a;
        }

        .asset-symbol {
            color: #a1aec6;
            font-size: 0.85rem;
        }

        body.light-mode .asset-symbol {
            color: #64748b;
        }

        .asset-price {
            color: #60a5fa;
            font-weight: 700;
        }

        .asset-divider {
            height: 1px;
            background: rgba(148, 163, 184, 0.1);
            margin: 1rem 0;
        }

        .asset-holding {
            color: #a1aec6;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        body.light-mode .asset-holding {
            color: #64748b;
        }

        .asset-value {
            color: #cbd5e1;
            font-weight: 600;
        }

        body.light-mode .asset-value {
            color: #1a1a1a;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 1rem;
            }

            .wallet-title {
                font-size: 1.5rem;
            }

            .qfs-logo {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }

            .container {
                padding: 1rem;
                margin-top: 200px;
            }

            .card {
                padding: 1.5rem;
            }

            .card-amount {
                font-size: 2rem;
            }

            .assets-grid {
                grid-template-columns: 1fr;
            }

            .theme-toggle {
                top: 140px;
                right: 1.5rem;
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>

    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">
        <i class="fas fa-moon"></i>
    </button>

    <!-- Header -->
    <div class="header" id="header">
        <div class="header-left">
            <div class="wallet-title">QFS Wallet</div>
            <div class="qfs-logo">QFS</div>
        </div>
        <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Total Balance Card -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon">
                    <i class="fas fa-wallet"></i>
                </div>
                <div class="card-title">Total Balance</div>
            </div>
            <div class="card-amount">$62,825,286.61</div>
            <div class="card-footer">
                <div class="card-currency">
                    <span class="flag">🇺🇸</span>
                    <span>USD</span>
                </div>
                <a class="more-details" href="#">
                    <i class="fas fa-file-alt"></i> More Details
                </a>
            </div>
        </div>

        <!-- Pending Withdrawals Card -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon">
                    <i class="fas fa-hourglass-half"></i>
                </div>
                <div class="card-title">Pending Withdrawals</div>
            </div>
            <div class="card-amount">$0.00</div>
            <div class="card-footer">
                <div class="card-currency">
                    <span class="flag">🇺🇸</span>
                    <span>USD</span>
                </div>
                <button class="withdraw-btn-card" onclick="goToWithdraw()">
                    <i class="fas fa-arrow-right"></i> Withdraw Funds
                </button>
            </div>
        </div>

        <!-- Today Transactions Card -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon">
                    <i class="fas fa-exchange-alt"></i>
                </div>
                <div class="card-title">Today Transactions</div>
            </div>
            <div class="card-amount">$100.00</div>
            <div class="card-footer">
                <div class="card-currency">
                    <span class="flag">🇺🇸</span>
                    <span>USD</span>
                </div>
                <a class="more-details" href="#">
                    <i class="fas fa-file-alt"></i> More Details
                </a>
            </div>
        </div>

        <!-- Digital Assets Section -->
        <div class="assets-section">
            <div class="assets-title">Digital Assets</div>
            <div class="assets-grid" id="assetsContainer">
                <div style="text-align: center; color: #a1aec6; padding: 2rem;">
                    <div class="spinner"></div>
                    <p>Loading asset data...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme Toggle Functionality
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        // Check for saved theme preference or default to dark mode
        const currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'light') {
            body.classList.add('light-mode');
            themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }

        // Theme toggle click handler
        themeToggle.addEventListener('click', function() {
            body.classList.toggle('light-mode');
            
            if (body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
                themeToggle.title = 'Switch to Dark Mode';
            } else {
                localStorage.setItem('theme', 'dark');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
                themeToggle.title = 'Switch to Light Mode';
            }
        });

        // Hide header on scroll
        let lastScrollTop = 0;
        const header = document.getElementById('header');

        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            // Show header when at the top
            if (scrollTop < 50) {
                header.classList.remove('hidden');
            } 
            // Hide header when scrolling down
            else if (scrollTop > lastScrollTop) {
                header.classList.add('hidden');
            }
            // Show header when scrolling up
            else {
                header.classList.remove('hidden');
            }
            
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        });

        // Fixed crypto holdings
        const holdings = {
            'bitcoin': { amount: 750, value: 59625000, symbol: 'BTC' },
            'ethereum': { amount: 24000, value: 1560000, symbol: 'ETH' },
            'ripple': { amount: 42000000, value: 600000, symbol: 'XRP' },
            'litecoin': { amount: 1300000, value: 45000, symbol: 'LTC' },
            'cardano': { amount: 300000000, value: 630000, symbol: 'ADA' },
            'polkadot': { amount: 75000000, value: 195000, symbol: 'DOT' },
            'dogecoin': { amount: 750000000, value: 170286.61, symbol: 'DOGE' }
        };

        // Coin logos
        const coinLogos = {
            'bitcoin': 'https://assets.coingecko.com/coins/images/1/large/bitcoin.png',
            'ethereum': 'https://assets.coingecko.com/coins/images/279/large/ethereum.png',
            'ripple': 'https://assets.coingecko.com/coins/images/44/large/xrp.png',
            'litecoin': 'https://assets.coingecko.com/coins/images/2/large/litecoin.png',
            'cardano': 'https://assets.coingecko.com/coins/images/975/large/cardano.png',
            'polkadot': 'https://assets.coingecko.com/coins/images/12171/large/polkadot.png',
            'dogecoin': 'https://assets.coingecko.com/coins/images/5/large/dogecoin.png'
        };

        const coinNames = {
            'bitcoin': 'Bitcoin',
            'ethereum': 'Ethereum',
            'ripple': 'Ripple',
            'litecoin': 'Litecoin',
            'cardano': 'Cardano',
            'polkadot': 'Polkadot',
            'dogecoin': 'Dogecoin'
        };

        function displayAssets() {
            const container = document.getElementById('assetsContainer');
            container.innerHTML = '';

            // Sort by value descending
            const sortedAssets = Object.entries(holdings).sort(([,a], [,b]) => b.value - a.value);

            sortedAssets.forEach(([cryptoKey, { amount, value, symbol }]) => {
                const price = value / amount;
                const logoUrl = coinLogos[cryptoKey];
                const name = coinNames[cryptoKey];

                const card = document.createElement('div');
                card.className = 'asset-card';
                card.innerHTML = `
                    <div class="asset-top">
                        <div class="asset-info">
                            <div class="asset-logo">
                                <img src="${logoUrl}" alt="${symbol}" onerror="this.style.display='none'">
                            </div>
                            <div>
                                <div class="asset-name">${name}</div>
                                <div class="asset-symbol">${symbol}</div>
                            </div>
                        </div>
                        <div class="asset-price">$${price.toFixed(2)}</div>
                    </div>
                    <div class="asset-divider"></div>
                    <div class="asset-holding">Amount Held: <span class="asset-value">${amount.toLocaleString()} ${symbol}</span></div>
                    <div class="asset-holding">Total Value: <span class="asset-value">$${value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span></div>
                `;
                container.appendChild(card);
            });
        }

        function goToWithdraw() {
            window.location.href = 'withdraw.html';
        }

        function logout() {
            window.location.href = 'login.html';
        }

        displayAssets();
    </script>
</body>
</html>
