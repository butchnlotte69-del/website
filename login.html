<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QFS USA Login Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #0f1419 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            transition: background 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Enhanced Crypto USA Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 15% 30%, rgba(59, 130, 246, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 85% 70%, rgba(139, 92, 246, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.15) 0%, transparent 70%),
                radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGradient 8s ease-in-out infinite;
        }

        @keyframes pulseGradient {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Animated crypto symbols background - More Visible */
        body::after {
            content: '₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $ ₿ Ξ ◆ $';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-size: 10rem;
            font-weight: bold;
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.4;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #10b981, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: drift 25s linear infinite;
        }

        @keyframes drift {
            0% { transform: translateY(0px) translateX(0px); }
            100% { transform: translateY(-1500px) translateX(50px); }
        }

        /* Grid Pattern Background */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px),
                linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        body.light-mode {
            background: linear-gradient(135deg, #f0f4f8 0%, #e0e7ff 50%, #f3f4f6 100%);
            color: #1a1a1a;
        }

        body.light-mode::before {
            background: 
                radial-gradient(circle at 15% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 70%),
                radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
        }

        body.light-mode::after {
            opacity: 0.05;
        }

        body.light-mode .grid-background {
            background-image: 
                linear-gradient(90deg, rgba(139, 92, 246, 0.08) 1px, transparent 1px),
                linear-gradient(rgba(139, 92, 246, 0.08) 1px, transparent 1px);
            opacity: 0.4;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.3);
            border: 2px solid rgba(59, 130, 246, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            z-index: 9999;
            color: #fbbf24;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }

        .theme-toggle:hover {
            background: rgba(59, 130, 246, 0.4);
            border-color: rgba(59, 130, 246, 0.9);
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.4);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        body.light-mode .theme-toggle {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
            color: #3b82f6;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
        }

        body.light-mode .theme-toggle:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.8);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.3);
        }

        .login-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            height: 100vh;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
            border-radius: 0;
        }

        body.light-mode .login-wrapper {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .login-left {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 50%, #8b5cf6 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem 2rem;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Animated crypto coins on left side */
        .login-left::before {
            content: '₿ Ξ ◆';
            position: absolute;
            font-size: 20rem;
            opacity: 0.12;
            animation: float 15s ease-in-out infinite;
            top: -10%;
            right: -5%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        .login-left-content {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .login-left h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .login-left p {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.95;
            max-width: 400px;
            line-height: 1.6;
        }

        .login-right {
            background: linear-gradient(135deg, rgba(30, 30, 50, 0.95) 0%, rgba(20, 20, 35, 0.95) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        body.light-mode .login-right {
            background: linear-gradient(135deg, rgba(240, 244, 248, 0.98) 0%, rgba(224, 231, 255, 0.98) 100%);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #3b82f6;
        }

        body.light-mode .login-header h1 {
            color: #1e40af;
        }

        .login-header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        body.light-mode .login-header p {
            color: #475569;
        }

        .success-message {
            display: none;
            padding: 1rem;
            margin-bottom: 1.5rem;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.5);
            border-radius: 8px;
            color: #10b981;
            text-align: center;
            font-weight: 500;
            font-size: 0.95rem;
            animation: slideIn 0.3s ease;
        }

        .error-message {
            display: none;
            padding: 1rem;
            margin-bottom: 1.5rem;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 8px;
            color: #ef4444;
            text-align: center;
            font-weight: 500;
            font-size: 0.95rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        body.light-mode .form-group label {
            color: #475569;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.5);
            color: #e2e8f0;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        body.light-mode .form-group input {
            background: rgba(255, 255, 255, 0.8);
            color: #1a1a1a;
            border-color: rgba(59, 130, 246, 0.2);
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(30, 41, 59, 0.7);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        body.light-mode .form-group input:focus {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.05);
        }

        .form-group input::placeholder {
            color: rgba(226, 232, 240, 0.5);
        }

        body.light-mode .form-group input::placeholder {
            color: rgba(71, 85, 105, 0.5);
        }

        .submit-btn {
            width: 100%;
            padding: 0.875rem 1rem;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            margin-bottom: 1.5rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.3), transparent);
            margin: 1.5rem 0;
        }

        body.light-mode .divider {
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.2), transparent);
        }

        .links {
            text-align: center;
            font-size: 0.9rem;
        }

        .links a {
            color: #3b82f6;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        body.light-mode .links a {
            color: #1e40af;
        }

        .links a:hover {
            color: #8b5cf6;
            text-decoration: underline;
        }

        body.light-mode .links a:hover {
            color: #7c3aed;
        }

        .links a:active {
            transform: scale(0.98);
        }

        @media (max-width: 1024px) {
            .login-wrapper {
                grid-template-columns: 1fr;
                height: auto;
            }

            .login-left {
                min-height: 300px;
                padding: 3rem 2rem;
            }

            .login-right {
                min-height: 100vh;
                padding: 2rem;
            }

            .login-left h2 {
                font-size: 2rem;
            }
        }

        @media (max-width: 640px) {
            .theme-toggle {
                width: 45px;
                height: 45px;
                font-size: 1.25rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .login-left h2 {
                font-size: 1.5rem;
            }

            .login-left p {
                font-size: 0.95rem;
            }

            .form-group input {
                padding: 0.65rem 0.875rem;
                font-size: 0.95rem;
            }

            .submit-btn {
                padding: 0.75rem;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <div class="grid-background"></div>
    <button id="themeToggle" class="theme-toggle" title="Switch to Light Mode">
        <i class="fas fa-moon"></i>
    </button>

    <div class="login-wrapper">
        <div class="login-left">
            <div class="login-left-content">
                </div>
                <h2>Quantum Financial System</h2>
                <p>Secure, professional cryptocurrency management for enterprise clients worldwide.</p>
            </div>
        </div>

        <div class="login-right">
            <div class="login-container">
                <div class="login-header">
                    <h1>QFS USA Login Portal</h1>
                    <p>Sign in to your secure account</p>
                </div>

                <div class="success-message" id="successMessage">
                    ✓ Login successful! Redirecting...
                </div>

                <div class="error-message" id="errorMessage">
                    ✗ Invalid password. Password is case-sensitive.
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="submit-btn">Sign In</button>

                    <div class="divider"></div>

                    <div class="links">
                        <a id="forgotPasswordLink" href="#">Forgot Password?</a> | <a id="createAccountLink" href="#">Create Account</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Theme Toggle Functionality
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        const body = document.body;

        // Check for saved theme preference or default to dark mode
        const currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'light') {
            body.classList.add('light-mode');
            themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }

        // Theme toggle click handler
        themeToggle.addEventListener('click', function() {
            body.classList.toggle('light-mode');
            
            if (body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
                themeToggle.title = 'Switch to Dark Mode';
            } else {
                localStorage.setItem('theme', 'dark');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
                themeToggle.title = 'Switch to Light Mode';
            }
        });

        // Forgot Password Link Handler
        document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Please contact your agent for assistance.');
        });

        // Create Account Link Handler
        document.getElementById('createAccountLink').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Please contact your agent for assistance.');
        });

        // Login Form Handler - Only accepts password "Client601"
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            
            // Check if password is exactly "Client601"
            if (password === 'Client601') {
                errorMessage.style.display = 'none';
                successMessage.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'wallet.html';
                }, 1500);
                
                console.log('Login successful - Email:', email);
            } else {
                successMessage.style.display = 'none';
                errorMessage.style.display = 'block';
                document.getElementById('password').value = '';
                console.log('Login failed - Invalid password');
            }
        });
    </script>
</body>
</html>
