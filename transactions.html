<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Transactions - QFS Wallet</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #0f1419 100%);
            min-height: 100vh;
            color: #e2e8f0;
            transition: background 0.3s ease;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 15% 30%, rgba(59, 130, 246, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 85% 70%, rgba(139, 92, 246, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.12) 0%, transparent 70%),
                radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGradient 8s ease-in-out infinite;
        }

        @keyframes pulseGradient {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(90deg, rgba(59, 130, 246, 0.08) 1px, transparent 1px),
                linear-gradient(rgba(59, 130, 246, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        body.light-mode {
            background: linear-gradient(135deg, #f0f4f8 0%, #e0e7ff 50%, #f3f4f6 100%);
            color: #1a1a1a;
        }

        body.light-mode::before {
            background: 
                radial-gradient(circle at 15% 30%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 85% 70%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 70%),
                radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.06) 0%, transparent 50%);
        }

        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.3);
            border: 2px solid rgba(59, 130, 246, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            z-index: 9999;
            color: #fbbf24;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }

        .theme-toggle:hover {
            background: rgba(59, 130, 246, 0.4);
            border-color: rgba(59, 130, 246, 0.9);
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.4);
        }

        body.light-mode .theme-toggle {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
            color: #3b82f6;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-btn {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.5);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }

        body.light-mode .back-btn {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.light-mode .page-title {
            color: #0f172a;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
            margin-top: 120px;
        }

        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .transaction-item {
            background: linear-gradient(135deg, rgba(30, 64, 131, 0.6) 0%, rgba(30, 64, 131, 0.4) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .transaction-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.5);
        }

        body.light-mode .transaction-item {
            background: linear-gradient(135deg, rgba(200, 210, 240, 0.4) 0%, rgba(200, 210, 240, 0.2) 100%);
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .transaction-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #60a5fa;
        }

        .transaction-info h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .transaction-info p {
            font-size: 0.85rem;
            color: #a1aec6;
        }

        body.light-mode .transaction-info p {
            color: #64748b;
        }

        .transaction-right {
            text-align: right;
        }

        .transaction-amount {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.light-mode .transaction-amount {
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .transaction-status {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            display: inline-block;
        }

        .status-completed {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .status-pending {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .status-failed {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .no-transactions {
            text-align: center;
            padding: 3rem 2rem;
            background: linear-gradient(135deg, rgba(30, 64, 131, 0.6) 0%, rgba(30, 64, 131, 0.4) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .no-transactions-icon {
            font-size: 3rem;
            opacity: 0.5;
            margin-bottom: 1rem;
        }

        .no-transactions p {
            color: #a1aec6;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
                margin-top: 100px;
            }

            .transaction-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .transaction-right {
                text-align: left;
                align-self: flex-start;
            }

            .header-left {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>

    <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">
        <i class="fas fa-moon"></i>
    </button>

    <div class="header">
        <div class="header-left">
            <a href="wallet.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                Back to Wallet
            </a>
            <h1 class="page-title">Recent Transactions</h1>
        </div>
    </div>

    <div class="container">
        <div class="transactions-list" id="transactionsList">
            <!-- Transactions will be loaded here -->
        </div>
    </div>

    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const currentTheme = localStorage.getItem('theme') || 'dark';
        
        if (currentTheme === 'light') {
            body.classList.add('light-mode');
            themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }

        themeToggle.addEventListener('click', function() {
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                localStorage.setItem('theme', 'dark');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            }
        });

        // Sample transaction data
        const transactions = [
            {
                id: 1,
                type: 'received',
                icon: 'fa-arrow-down',
                description: 'Transfer Received',
                date: 'Sept 3, 2026',
                amount: '$5,250.00',
                status: 'completed',
                statusClass: 'status-completed'
            },
            {
                id: 2,
                type: 'sent',
                icon: 'fa-arrow-up',
                description: 'Payment Sent',
                date: 'Sept 2, 2026',
                amount: '-$2,100.00',
                status: 'completed',
                statusClass: 'status-completed'
            },
            {
                id: 3,
                type: 'received',
                icon: 'fa-arrow-down',
                description: 'Deposit Received',
                date: 'Sept 1, 2026',
                amount: '$10,000.00',
                status: 'completed',
                statusClass: 'status-completed'
            },
            {
                id: 4,
                type: 'sent',
                icon: 'fa-arrow-up',
                description: 'Withdrawal Requested',
                date: 'Aug 31, 2026',
                amount: '-$3,500.00',
                status: 'pending',
                statusClass: 'status-pending'
            },
            {
                id: 5,
                type: 'received',
                icon: 'fa-arrow-down',
                description: 'Refund Processed',
                date: 'Aug 30, 2026',
                amount: '$750.00',
                status: 'completed',
                statusClass: 'status-completed'
            },
            {
                id: 6,
                type: 'sent',
                icon: 'fa-arrow-up',
                description: 'Transfer Failed',
                date: 'Aug 29, 2026',
                amount: '-$1,200.00',
                status: 'failed',
                statusClass: 'status-failed'
            }
        ];

        // Render transactions
        const transactionsList = document.getElementById('transactionsList');

        if (transactions.length === 0) {
            transactionsList.innerHTML = `
                <div class="no-transactions">
                    <div class="no-transactions-icon">
                        <i class="fas fa-inbox"></i>
                    </div>
                    <p>No recent transactions</p>
                </div>
            `;
        } else {
            transactionsList.innerHTML = transactions.map(tx => `
                <div class="transaction-item">
                    <div class="transaction-left">
                        <div class="transaction-icon">
                            <i class="fas ${tx.icon}"></i>
                        </div>
                        <div class="transaction-info">
                            <h3>${tx.description}</h3>
                            <p>${tx.date}</p>
                        </div>
                    </div>
                    <div class="transaction-right">
                        <div class="transaction-amount">${tx.amount}</div>
                        <div class="transaction-status ${tx.statusClass}">
                            ${tx.status.charAt(0).toUpperCase() + tx.status.slice(1)}
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
